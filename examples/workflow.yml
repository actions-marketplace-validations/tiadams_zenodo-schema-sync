name: Zenodo metadata

# Runs on the release event, so Zenodo's own GitHub integration must be off.
# If it is on, drop `release` and trigger workflow_dispatch after Zenodo
# archives the release; otherwise both race to create a deposit.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to sync, for example v1.2.3
        required: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: tiadams/zenodo-schema-sync@v1
        with:
          mode: sync
          version: ${{ github.event.release.tag_name || inputs.tag }}
          token: ${{ secrets.ZENODO_TOKEN }}
